services:
  tailscale:
    image: tailscale/tailscale:v1.103
    container_name: tailscale
    hostname: tailscale-nginx
    environment:
      - TS_AUTHKEY=tskey-auth-kYLVNtr7Jp11CNTRL-NGzYQpB91HeyAbaDgqy1Ge2iHyFoJ1Pw
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped
